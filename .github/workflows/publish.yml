name: Publish to pub.dev

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-validation:
    name: Release validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package_version="$(awk '$1 == "version:" { print $2 }' pubspec.yaml)"
          test "$TAG_NAME" = "v$package_version"
      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test example/lib example/test example/integration_test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test package
        run: flutter test
      - name: Analyze example
        working-directory: example
        run: flutter analyze --fatal-infos
      - name: Test example
        working-directory: example
        run: flutter test
      - name: Validate publish contents
        run: flutter pub publish --dry-run

  publish:
    needs: release-validation
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
    with:
      environment: pub.dev
