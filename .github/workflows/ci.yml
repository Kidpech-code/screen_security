name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.6

jobs:
  flutter-quality:
    name: Flutter quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test example/lib example/test example/integration_test
      - name: Analyze package
        run: flutter analyze --fatal-infos
      - name: Test package
        run: flutter test --coverage
      - name: Analyze example
        working-directory: example
        run: flutter analyze --fatal-infos
      - name: Test example
        working-directory: example
        run: flutter test
      - name: Validate publish contents
        run: flutter pub publish --dry-run

  android-native:
    name: Android native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android example
        working-directory: example
        run: flutter build apk --debug
      - name: Run Android plugin tests
        working-directory: example/android
        run: ./gradlew :screen_security:testDebugUnitTest
      - name: Set up Flutter 3.3 consumer floor
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.3.10
          channel: stable
          cache: true
      - name: Build Flutter 3.3 Android consumer
        shell: bash
        run: |
          consumer_dir="$(mktemp -d)"
          trap 'rm -rf "$consumer_dir"' EXIT
          flutter create \
            --platforms=android \
            --android-language kotlin \
            --project-name screen_security_legacy_consumer \
            "$consumer_dir"
          cd "$consumer_dir"
          python3 - <<'PY'
          import os
          from pathlib import Path

          pubspec = Path("pubspec.yaml")
          pubspec_contents = pubspec.read_text()
          pubspec.write_text(
              pubspec_contents.replace(
                  "dependencies:\n",
                  "dependencies:\n  screen_security:\n"
                  f"    path: {os.environ['GITHUB_WORKSPACE']}\n",
                  1,
              )
          )

          build_gradle = Path("android/app/build.gradle")
          build_gradle_contents = build_gradle.read_text()
          updated_build_gradle = build_gradle_contents.replace(
              "minSdkVersion flutter.minSdkVersion", "minSdkVersion 24"
          )
          if updated_build_gradle == build_gradle_contents:
              raise SystemExit("Could not set minSdkVersion 24 in the legacy consumer")
          build_gradle.write_text(updated_build_gradle)
          PY
          flutter pub get
          flutter build apk --debug

  ios-native:
    name: iOS native
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build iOS example
        working-directory: example
        run: flutter build ios --simulator --debug
      - name: Run iOS native tests
        run: bash tool/run_ios_tests.sh
