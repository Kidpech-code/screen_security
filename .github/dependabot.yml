version: 2
updates:
  # ponytail: one grouped PR per ecosystem per month instead of one PR per dependency.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      pub:
        patterns:
          - "*"

  - package-ecosystem: pub
    directory: /example
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      pub-example:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      gradle:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /example/android
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      gradle-example:
        patterns:
          - "*"
